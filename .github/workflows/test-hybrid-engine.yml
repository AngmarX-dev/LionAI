name: LionAI scratch model and data tests

on:
  push:
    branches: [main]
    paths:
      - "lionai_hybrid.py"
      - "lionai_scratch.py"
      - "training/**"
      - "tests/**"
      - ".github/workflows/test-hybrid-engine.yml"
  pull_request:
    paths:
      - "lionai_hybrid.py"
      - "lionai_scratch.py"
      - "training/**"
      - "tests/**"
      - ".github/workflows/test-hybrid-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5.0"
      - name: Compile Python modules
        run: |
          python -m py_compile lionai_hybrid.py lionai_scratch.py \
            training/train_scratch.py training/predict_scratch.py training/evaluate_scratch.py \
            training/lionai_gguf_runtime.py training/project_engine.py training/project_intent.py training/natural_language_planner.py training/metadata_rules.py \
            training/calibrate_scratch.py training/calibration.py training/audit_scratch_data.py \
            training/import_hf_dataset.py training/import_github_metadata.py training/build_metadata_corpus.py \
            tests/test_hf_dataset_import.py tests/test_github_metadata_import.py tests/test_metadata_corpus_builder.py tests/test_split_metadata_corpus.py \
            tests/test_lionai_gguf_runtime.py tests/test_project_engine.py tests/test_project_intent.py \
            tests/test_lionai_calibration.py tests/test_lionai_calibration_inference.py \
            tests/test_lionai_hybrid.py tests/test_lionai_scratch.py \
            tests/test_lionai_scratch_inference.py tests/test_lionai_scratch_evaluation.py \
            tests/test_lionai_scratch_data_audit.py tests/test_lionai_scratch_training_split.py
      - name: Verify training and import CLI entry points
        run: |
          python training/train_scratch.py --help
          python training/predict_scratch.py --help
          python training/lionai_gguf_runtime.py --help
          python training/evaluate_scratch.py --help
          python training/calibrate_scratch.py --help
          python training/import_hf_dataset.py --help
          python training/import_github_metadata.py --help
          python training/build_metadata_corpus.py --help
          python training/audit_scratch_data.py
      - name: Run project tests
        run: python -m unittest discover -s tests -v

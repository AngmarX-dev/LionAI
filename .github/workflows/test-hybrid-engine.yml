name: LionAI hybrid engine tests

on:
  push:
    branches: [main]
    paths:
      - "lionai_hybrid.py"
      - "lionai_scratch.py"
      - "training/**"
      - "lionai_scratch.py"
      - "tests/**"
      - ".github/workflows/test-hybrid-engine.yml"
  pull_request:
    paths:
      - "lionai_hybrid.py"
      - "lionai_scratch.py"
      - "training/**"
      - "tests/**"
      - ".github/workflows/test-hybrid-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependency
        run: python -m pip install --upgrade pip torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Python modules
        run: python -m py_compile lionai_hybrid.py lionai_scratch.py training/train_scratch.py training/predict_scratch.py training/evaluate_scratch.py training/audit_scratch_data.py tests/test_lionai_hybrid.py tests/test_lionai_scratch.py tests/test_lionai_scratch_inference.py tests/test_lionai_scratch_evaluation.py tests/test_lionai_scratch_data_audit.py tests/test_lionai_scratch_training_split.py
      - name: Run project tests
        run: python -m unittest discover -s tests -v

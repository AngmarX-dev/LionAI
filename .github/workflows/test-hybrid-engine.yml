name: LionAI hybrid engine tests

on:
  push:
    branches: [main]
    paths:
      - "lionai_hybrid.py"
      - "lionai_scratch.py"
      - "training/train_scratch.py"
      - "training/lionai_scratch_train.jsonl"
      - "tests/**"
      - ".github/workflows/test-hybrid-engine.yml"
  pull_request:
    paths:
      - "lionai_hybrid.py"
      - "tests/**"
      - ".github/workflows/test-hybrid-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m py_compile lionai_hybrid.py lionai_scratch.py training/train_scratch.py tests/test_lionai_hybrid.py tests/test_lionai_scratch.py
      - name: Run hybrid engine tests
        run: python -m unittest discover -s tests -v

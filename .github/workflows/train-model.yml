name: Train LionAI LLM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/train-model.yml'
      - 'training/train_llm.py'
      - 'training/lionai_sft.jsonl'
      - 'training/validate_dataset.py'
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of CPU training epochs"
        required: true
        default: "5"
        type: string
      max_length:
        description: "Maximum token sequence length"
        required: true
        default: "768"
        type: string

permissions:
  contents: read

concurrency:
  group: lionai-cpu-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main and retrieve Git LFS model weights
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Validate base model and training dataset
        shell: bash
        run: |
          set -euo pipefail
          test -s models/Qwen2.5-0.5B-Instruct/config.json
          test -s models/Qwen2.5-0.5B-Instruct/model.safetensors
          test -s models/Qwen2.5-0.5B-Instruct/tokenizer.json
          python training/validate_dataset.py training/lionai_sft.jsonl
          du -sh models/Qwen2.5-0.5B-Instruct

      - name: Install CPU-only PyTorch and training dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0"
          python -m pip install -r training/requirements.txt

      - name: Run improved LoRA fine-tuning on CPU
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python training/train_llm.py \
            --model models/Qwen2.5-0.5B-Instruct \
            --data training/lionai_sft.jsonl \
            --output artifacts/lionai-qwen-lora \
            --epochs "${{ inputs.epochs || 5 }}" \
            --max-length "${{ inputs.max_length || 768 }}"

      - name: Validate trained adapter and metrics
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/lionai-qwen-lora/adapter/adapter_config.json
          test -s artifacts/lionai-qwen-lora/adapter/adapter_model.safetensors
          test -s artifacts/lionai-qwen-lora/metrics.json
          python -m json.tool artifacts/lionai-qwen-lora/metrics.json
          du -sh artifacts/lionai-qwen-lora

      - name: Upload trained LoRA adapter
        uses: actions/upload-artifact@v4
        with:
          name: lionai-qwen2.5-0.5b-lora-cpu
          path: artifacts/lionai-qwen-lora/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

name: Evaluate LionAI LLM

on:
  push:
    branches: [main]
    paths:
      - 'training/evaluate_llm.py'
      - '.github/workflows/evaluate-model.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out main and retrieve base model
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Download the successful LoRA training artifact
        uses: actions/download-artifact@v4
        with:
          name: lionai-qwen2.5-0.5b-lora-cpu
          path: artifacts/lora
          repository: AngmarX-dev/LionAI
          run-id: 45039122377
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install CPU-only inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0"
          python -m pip install -r training/requirements.txt

      - name: Run deterministic held-out generation evaluation
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          test -s artifacts/lora/adapter/adapter_model.safetensors
          python training/evaluate_llm.py \
            --model models/Qwen2.5-0.5B-Instruct \
            --adapter artifacts/lora/adapter \
            --data training/lionai_sft.jsonl \
            --output artifacts/evaluation

      - name: Upload predictions and evaluation metrics
        uses: actions/upload-artifact@v4
        with:
          name: lionai-heldout-evaluation
          path: artifacts/evaluation/
          if-no-files-found: error
          retention-days: 14

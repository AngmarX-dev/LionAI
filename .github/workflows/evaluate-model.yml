name: Evaluate LionAI LLM

on:
  workflow_run:
    workflows: ["Train LionAI LLM"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      training_run_id:
        description: "Successful Train LionAI LLM workflow run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the exact training revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          lfs: true

      - name: Download the adapter from this exact training run
        uses: actions/download-artifact@v4
        with:
          name: lionai-qwen2.5-0.5b-lora-cpu
          path: artifacts/lora
          repository: AngmarX-dev/LionAI
          run-id: ${{ github.event.workflow_run.id || inputs.training_run_id }}
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install CPU-only inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0"
          python -m pip install -r training/requirements.txt

      - name: Validate both datasets
        run: python training/validate_dataset.py training/lionai_sft.jsonl training/lionai_eval.jsonl

      - name: Run deterministic independent generation evaluation
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          test -s artifacts/lora/adapter/adapter_model.safetensors
          python training/evaluate_llm.py \
            --model models/Qwen2.5-0.5B-Instruct \
            --adapter artifacts/lora/adapter \
            --data training/lionai_eval.jsonl \
            --output artifacts/evaluation

      - name: Upload predictions and evaluation metrics
        uses: actions/upload-artifact@v4
        with:
          name: lionai-heldout-evaluation
          path: artifacts/evaluation/
          if-no-files-found: error
          retention-days: 14

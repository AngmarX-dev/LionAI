name: Train LionAI Qwen3-8B (QLoRA)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Fine-tuning epochs"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: lionai-qwen3-8b-training
  cancel-in-progress: false

jobs:
  train:
    # Requires a user-managed Linux GPU runner with >=16 GiB VRAM.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qwen3 download and QLoRA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/requirements-qwen3.txt

      - name: Download Qwen3-8B into models/Qwen3-8B
        run: python training/download_model.py --model Qwen/Qwen3-8B --destination models/Qwen3-8B

      - name: Validate training dataset
        run: python training/validate_dataset.py training/lionai_sft.jsonl

      - name: Fine-tune Qwen3-8B with 4-bit QLoRA
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
        run: |
          python training/train_qwen3_qlora.py             --model models/Qwen3-8B             --data training/lionai_sft.jsonl             --output artifacts/lionai-qwen3-8b-qlora             --epochs "${{ inputs.epochs || 3 }}"

      - name: Verify adapter output
        run: |
          test -s artifacts/lionai-qwen3-8b-qlora/adapter/adapter_config.json
          test -s artifacts/lionai-qwen3-8b-qlora/adapter/adapter_model.safetensors
          test -s artifacts/lionai-qwen3-8b-qlora/metrics.json
          python -m json.tool artifacts/lionai-qwen3-8b-qlora/metrics.json

      - name: Upload Qwen3-8B adapter
        uses: actions/upload-artifact@v4
        with:
          name: lionai-qwen3-8b-qlora
          path: artifacts/lionai-qwen3-8b-qlora/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

name: Publish LionAI model to main

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-lionai-model
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Download the successful model artifact
        uses: actions/download-artifact@v4
        with:
          name: lionai-qwen2.5-0.5b-instruct
          path: models
          repository: AngmarX-dev/LionAI
          run-id: 45037537733
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate model files
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="models/Qwen2.5-0.5B-Instruct"
          test -s "$MODEL_DIR/config.json"
          test -s "$MODEL_DIR/model.safetensors"
          test -s "$MODEL_DIR/tokenizer.json"
          echo "Model directory:"
          du -sh "$MODEL_DIR"
          find "$MODEL_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit model with Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs track "models/Qwen2.5-0.5B-Instruct/*.safetensors"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes models/Qwen2.5-0.5B-Instruct
          if git diff --cached --quiet; then
            echo "No model changes to publish."
            exit 0
          fi
          git commit -m "model: add Qwen2.5-0.5B-Instruct"
          git push origin HEAD:main

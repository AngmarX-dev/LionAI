name: Download LionAI Qwen3-1.7B

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face downloader
        run: python -m pip install --upgrade "huggingface_hub>=0.26,<2"

      - name: Download and verify official checkpoint
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: |
          python -m pip install "huggingface_hub>=0.26,<2"
          python training/download_model.py --model Qwen/Qwen3-1.7B --destination models/Qwen3-1.7B

      - name: Upload verified model files
        uses: actions/upload-artifact@v4
        with:
          name: lionai-qwen3-1.7b-base-model
          path: models/Qwen3-1.7B/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

name: Download LionAI base model

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Hugging Face model revision (branch, tag, or commit)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: lionai-model-download-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  download-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: models/Qwen2.5-0.5B-Instruct
          key: ${{ runner.os }}-qwen2.5-0.5b-${{ inputs.revision }}
          restore-keys: |
            ${{ runner.os }}-qwen2.5-0.5b-

      - name: Install Hugging Face downloader
        run: python -m pip install --upgrade "huggingface_hub>=0.26,<2"

      - name: Download Qwen2.5-0.5B-Instruct into its own folder
        env:
          MODEL_REVISION: ${{ inputs.revision }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          destination = Path("models/Qwen2.5-0.5B-Instruct")
          destination.mkdir(parents=True, exist_ok=True)
          path = snapshot_download(
              repo_id="Qwen/Qwen2.5-0.5B-Instruct",
              revision=os.environ["MODEL_REVISION"],
              local_dir=str(destination),
              allow_patterns=[
                  "*.json",
                  "*.safetensors",
                  "*.model",
                  "*.txt",
                  "*.tiktoken",
                  "*.jinja",
              ],
          )
          print(f"Model folder: {path}")
          PY

      - name: Verify model folder and weights
        run: |
          test -s models/Qwen2.5-0.5B-Instruct/config.json
          find models/Qwen2.5-0.5B-Instruct -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find models/Qwen2.5-0.5B-Instruct -maxdepth 1 -name '*.safetensors' -type f -print -quit)"

      - name: Upload model folder as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lionai-qwen2.5-0.5b-instruct
          # Upload the parent directory so the artifact retains
          # Qwen2.5-0.5B-Instruct/ as its top-level folder.
          path: models/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

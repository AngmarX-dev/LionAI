name: LionAI metadata dataset import and full-corpus training

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-metadata-dataset.yml"
      - "training/split_metadata_corpus.py"
      - "training/train_scratch.py"
      - "lionai_scratch.py"
      - "tests/test_lionai_scratch.py"
      - "training/sampling.py"
      - "training/evaluate_scratch.py"
      - "training/import_github_metadata.py"
      - "training/github_metadata_sources.txt"
      - "training/github_metadata_eval_sources.txt"
  workflow_dispatch:
    inputs:
      max_rows:
        description: "Maximum Hugging Face rows to import (0 = all available rows)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  import-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dataset loader
        run: python -m pip install --upgrade pip "datasets>=3.0.0,<6.0.0"
      - name: Import all available Hugging Face metadata rows
        run: |
          python training/import_hf_dataset.py \
            --dataset AnodemTheGr8t/file_organiser_metadata \
            --split train \
            --revision main \
            --max-rows "${{ inputs.max_rows || '0' }}" \
            --output training/external/lionai_file_organiser_metadata.jsonl
      - name: Import real-world public GitHub filename metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python training/import_github_metadata.py \
            --max-files-per-repo 1500 \
            --max-repos 0
      - name: Import repository-disjoint independent evaluation metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python training/import_github_metadata.py \
            --sources training/github_metadata_eval_sources.txt \
            --output training/external/lionai_github_independent_eval.jsonl \
            --report training/external/lionai_github_independent_eval_report.json \
            --max-files-per-repo 3000 \
            --max-repos 0
      - name: Merge and audit all metadata sources
        run: |
          python training/build_metadata_corpus.py \
            --input training/lionai_scratch_train.jsonl \
            --input training/external/lionai_file_organiser_metadata.jsonl \
            --input training/external/lionai_github_metadata.jsonl \
            --output training/external/lionai_metadata_corpus.jsonl \
            --report training/external/lionai_metadata_corpus_report.json
      - name: Create topic-disjoint full-corpus splits
        run: |
          python training/split_metadata_corpus.py \
            --input training/external/lionai_metadata_corpus.jsonl \
            --output-dir training/external/splits \
            --validation-fraction 0.10 \
            --test-fraction 0.10
      - name: Install CPU training runtime
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5.0"
      - name: Train LionAI from random initialization
        run: |
          python training/train_scratch.py \
            --data training/external/splits/train.jsonl \
            --validation-data training/external/splits/validation.jsonl \
            --epochs 30 \
            --batch-size 64 \
            --learning-rate 0.00015 \
            --weight-decay 0.05 \
            --label-smoothing 0.05 \
            --sampling-power 0.25 \
            --d-model 128 \
            --n-heads 4 \
            --n-layers 2 \
            --feedforward 384 \
            --dropout 0.25 \
            --max-length 192 \
            --patience 6 \
            --output artifacts/lionai-scratch.pt \
            --history-output artifacts/training-history.json
      - name: Evaluate on the untouched topic-disjoint test split
        run: |
          python training/evaluate_scratch.py \
            --checkpoint artifacts/lionai-scratch.pt \
            --test training/external/splits/test.jsonl \
            --train training/external/splits/train.jsonl \
            --output artifacts/evaluation-report.json
      - name: Evaluate on repositories never used for training
        run: |
          python training/evaluate_scratch.py \
            --checkpoint artifacts/lionai-scratch.pt \
            --test training/external/lionai_github_independent_eval.jsonl \
            --train training/external/splits/train.jsonl \
            --output artifacts/independent-evaluation-report.json
      - name: Upload complete corpus, provenance, model and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: lionai-real-metadata-model-and-evaluation
          path: |
            training/external/lionai_file_organiser_metadata.jsonl
            training/external/lionai_github_metadata.jsonl
            training/external/lionai_github_metadata_report.json
            training/external/lionai_github_independent_eval.jsonl
            training/external/lionai_github_independent_eval_report.json
            artifacts/independent-evaluation-report.json
            training/external/lionai_metadata_corpus.jsonl
            training/external/lionai_metadata_corpus_report.json
            training/external/splits/
            artifacts/lionai-scratch.pt
            artifacts/training-history.json
            artifacts/evaluation-report.json
          if-no-files-found: error
          retention-days: 14
